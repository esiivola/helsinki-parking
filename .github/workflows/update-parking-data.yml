name: Update parking reference data

on:
  push:
    branches:
      - main
    paths:
      - scripts/update-parking-data.mjs
      - src/parking-providers.js
      - .github/workflows/update-parking-data.yml
  schedule:
    # One short standard-runner job per week. Public-repository Actions are
    # currently free. The shared snapshot is fresh for 10 days; Vantaa remains
    # available with a warning through day 31, while layers with runtime API
    # fallbacks switch to their source APIs after day 10.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: parking-reference-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate reference snapshot
        run: node scripts/update-parking-data.mjs

      - name: Commit updated snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/parking-reference.json public/data/vantaa-parking.json public/data/vantaa-parking/
          if git diff --cached --quiet; then
            echo "Reference data is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update parking reference data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with GITHUB_TOKEN do not trigger the push-based Pages
      # workflow, so dispatch it explicitly after a scheduled data update.
      - name: Deploy updated snapshots
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
